# но можете оставить, он не мешает.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    if ($host = loyalupp.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name loyalupp.ru;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    server_name loyalupp.ru;

    client_max_body_size 50M;

    # === НОВЫЕ НАСТРОЙКИ ДЛЯ REACT ===
    # Укажите точный путь к папке с билдом 
    # (если вы используете Vite, папка обычно называется dist, если Create React App — build)
    root /home/levone/levone-front-web/build;

    index index.html;

    location / {
        # Главная магия для React: перенаправляем все запросы на index.html
        try_files $uri $uri/ /index.html;
    }

    # (Опционально) Добавляем кэширование для статики, чтобы сайт работал быстрее
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # === VK Proxy — добавить в server {} блок loyalupp.ru ===

# Прокси для id.vk.ru (OAuth authorize, token exchange, user_info)
location /vkid/ {
    proxy_pass https://id.vk.ru/;
    proxy_ssl_server_name on;
    proxy_set_header Host id.vk.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_headers on;

    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    proxy_buffering off;
    proxy_request_buffering off;
}

# Прокси для api.vk.ru (JSONP API вызовы: users.get, groups.getById и т.д.)
location /vkapi/ {
    proxy_pass https://api.vk.ru/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.vk.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_headers on;

    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    proxy_buffering off;
    proxy_request_buffering off;
}


    ssl_certificate /etc/letsencrypt/live/loyalupp.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loyalupp.ru/privkey.pem; # managed by Certbot
}
