server {
    listen 443 ssl http2;
    server_name .levelupapp.ru;
    client_max_body_size 50M;

    location /static/ {
        alias /home/levone/levelup-back/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
	add_header Access-Control-Allow-Origin "*" always;
    	add_header Access-Control-Allow-Methods "GET, OPTIONS";
    	add_header Access-Control-Allow-Headers "Origin, Content-Type";
    }

    location /media/ {
        alias /home/levone/levelup-back/media/;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
        access_log off;
    }

    
    location / {
        # debug-removed
	limit_req zone=botlimit burst=30 nodelay;
        proxy_pass http://localhost:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

# Исправленные пути к НОВОМУ сертификату
    ssl_certificate /etc/letsencrypt/live/levelupapp.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/levelupapp.ru/privkey.pem;
    
 # managed by Certbot
}

server {
    if ($host = levelupapp.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name .levelupapp.ru;
    return 301 https://$host$request_uri;


}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    
    ssl_certificate     /etc/letsencrypt/live/levelupapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levelupapp.ru/privkey.pem;
    
    return 444;
}
