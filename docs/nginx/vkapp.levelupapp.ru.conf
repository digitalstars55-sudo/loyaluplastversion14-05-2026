server {
    listen 80;
    server_name vkapp.levelupapp.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vkapp.levelupapp.ru;

    ssl_certificate /etc/letsencrypt/live/levelupapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levelupapp.ru/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    root /home/levone/levone-front-v3/build;
    index index.html;

    location ^~ /banquet/ {
        alias /home/levone/levone-front-v3/build/banquet/;
        index index.html;
        try_files $uri $uri/ /banquet/index.html;
    }

    location = /banquet {
        return 301 https://$host/banquet/;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
