# map можно убрать, если у вас больше нет WebSocket-соединений к бэкенду, 
# но можете оставить, он не мешает.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    if ($host = levonework.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name levonework.ru *.levonework.ru;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    server_name levonework.ru *.levonework.ru;
    ssl_certificate /etc/letsencrypt/live/levonework.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/levonework.ru/privkey.pem; # managed by Certbot
    
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # === НОВЫЕ НАСТРОЙКИ ДЛЯ REACT ===
    # Укажите точный путь к папке с билдом 
    # (если вы используете Vite, папка обычно называется dist, если Create React App — build)
    root /home/levone/levone-front-v3/build; 
    
    index index.html;

    location ^~ /banquet/ {
        alias /home/levone/levone-front-v3/build/banquet/;
        index index.html;
        try_files $uri $uri/ /banquet/index.html;
    }

    location = /banquet {
        return 301 https://$host/banquet/;
    }

    location / {
        # Главная магия для React: перенаправляем все запросы на index.html
        try_files $uri $uri/ /index.html;
        # index.html / SPA-роуты — всегда свежие (ревалидация), иначе кэш старого билда
        add_header Cache-Control "no-cache";
    }

    # (Опционально) Добавляем кэширование для статики, чтобы сайт работал быстрее
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

}
